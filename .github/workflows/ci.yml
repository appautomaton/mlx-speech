name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Apple Silicon runner. MLX has no CPU fallback on x86.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run fast tests
        run: >-
          uv run pytest -q -ra
          --cov=mlx_speech
          --cov-report=term-missing:skip-covered
        env:
          # GitHub's virtualized macOS runner reports Metal but aborts custom kernels.
          MLX_SPEECH_DISABLE_CUSTOM_METAL: "1"

      - name: Validate opt-in test collection
        run: >-
          uv run pytest --collect-only -q
          tests/checkpoint/ tests/runtime/ tests/integration/
