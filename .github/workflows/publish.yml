name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify release ref and package versions
        run: python3 scripts/release/verify_version.py "$GITHUB_REF_NAME"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build
        run: uv build --no-sources

      - name: Verify wheel metadata and dots.tts runtime
        run: python3 scripts/release/verify_wheel.py dist/*.whl --version "${GITHUB_REF_NAME#v}"

      - name: Upload dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
